services:
  postgres:
    image: postgres:17-alpine
    container_name: erp-agencia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: erp_agencia
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: erp
    ports:
      - "55432:5432"
    volumes:
      - erp_agencia_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp -d erp_agencia"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  erp_agencia_postgres_data:
